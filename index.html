<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & manifest -->
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Default title & description (overridden per-page by SEOHead) -->
    <title>ServCheck — Is Your Mechanic Quote Fair? | Australia's Car Service Checker</title>
    <meta name="description" content="Check if your mechanic is overcharging you. ServCheck analyses quotes, tracks your car's service history, and connects you with trusted Australian mechanics." />

    <!-- Geo targeting -->
    <meta name="geo.region" content="AU" />
    <meta name="geo.country" content="AU" />
    <meta name="language" content="en-AU" />

    <!-- Author / brand -->
    <meta name="author" content="ServCheck" />
    <meta name="copyright" content="ServCheck Australia" />

    <!-- Theme & mobile app -->
    <meta name="theme-color" content="#1a237e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ServCheck" />

    <!-- Default Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ServCheck" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:title" content="ServCheck — Is Your Mechanic Quote Fair?" />
    <meta property="og:description" content="Check if your mechanic is overcharging you. Australia's car service transparency platform." />
    <meta property="og:image" content="https://media.base44.com/images/public/69c3e608178c08315713aa79/cddf3b441_generated_image.png" />
    <meta property="og:url" content="https://servcheck.com.au" />

    <!-- Default Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ServCheck — Is Your Mechanic Quote Fair?" />
    <meta name="twitter:description" content="Check if your mechanic is overcharging you. Australia's car service transparency platform." />
    <meta name="twitter:image" content="https://media.base44.com/images/public/69c3e608178c08315713aa79/cddf3b441_generated_image.png" />

    <!-- Performance: preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
